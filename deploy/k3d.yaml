# Local cluster that behaves like the production k3s VPS: same Traefik ingress, same NetworkPolicy engine.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: mcp-portal
servers: 1
agents: 0
ports:
  - port: 80:80
    nodeFilters: [loadbalancer]
  - port: 443:443
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs:
      - arg: --disable=metrics-server   # not needed here; saves memory on small laptops
        nodeFilters: [server:*]
