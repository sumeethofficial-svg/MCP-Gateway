{{- /* Generated once per store and never shown in values. Deleted with the namespace. */ -}}
{{- $mysqlRoot := include "mcp-store.secretValue" (dict "root" . "id" "mysqlRoot" "secret" "mysql-credentials" "key" "root-password" "len" 32) -}}
{{- $mysqlUser := include "mcp-store.secretValue" (dict "root" . "id" "mysqlUser" "secret" "mysql-credentials" "key" "password" "len" 32) -}}
{{- $wpAdmin := include "mcp-store.secretValue" (dict "root" . "id" "wpAdmin" "secret" "wordpress-admin" "key" "password" "len" 24) -}}
{{- $wooCk := include "mcp-store.secretValue" (dict "root" . "id" "wooCk" "secret" "woo-api" "key" "consumer-key" "len" 40) -}}
{{- $wooCs := include "mcp-store.secretValue" (dict "root" . "id" "wooCs" "secret" "woo-api" "key" "consumer-secret" "len" 40) -}}
{{- $wooCk = regexReplaceAll "^(ck_)+" $wooCk "" -}}
{{- $wooCs = regexReplaceAll "^(cs_)+" $wooCs "" -}}
{{- $token := include "mcp-store.secretValue" (dict "root" . "id" "wooToken" "secret" "woo-mcp-auth" "key" "token" "len" 48) -}}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  labels:
    {{- include "mcp-store.labels" (dict "root" . "component" "database" "name" "mysql") | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ $mysqlRoot | quote }}
  password: {{ $mysqlUser | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-admin
  labels:
    {{- include "mcp-store.labels" (dict "root" . "component" "storefront" "name" "wordpress") | nindent 4 }}
type: Opaque
stringData:
  password: {{ $wpAdmin | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woo-api
  labels:
    {{- include "mcp-store.labels" (dict "root" . "component" "storefront" "name" "wordpress") | nindent 4 }}
type: Opaque
stringData:
  consumer-key: {{ printf "ck_%s" $wooCk | quote }}
  consumer-secret: {{ printf "cs_%s" $wooCs | quote }}
---
# The bearer token the gateway presents to this store's woo-mcp. The provisioner reads it once to register the store.
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp-auth
  labels:
    {{- include "mcp-store.labels" (dict "root" . "component" "mcp-server" "name" "woo-mcp") | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
